<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'sha256-/3EmdCehoYyTBKsgOVJ7BbgHmhqV1GkoK7p0W/zw85o='; img-src data:">
<title>Z</title>
<style>
  :root { color-scheme: dark; --bg:#2b2b2d; --ink:#f5f5f7; --ink2:#a1a1a6; --z:#3d9bff; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: -apple-system, "Segoe UI", "Noto Sans", "Noto Sans Hebrew", "Noto Sans Arabic", Ubuntu, system-ui, sans-serif;
         display: grid; place-items: center; text-align: center; user-select: none; }
  .box { max-width: 420px; padding: 24px; display: grid; gap: 12px; justify-items: center; }
  .logo { width: 64px; height: 64px; border-radius: 18px; background: linear-gradient(135deg,#0a4bff,#6a4cff); display: grid; place-items: center; font: 700 30px/1 system-ui, sans-serif; color: #fff; margin-bottom: 8px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0; }
  p { margin: 0; color: var(--ink2); font-size: 15px; line-height: 1.5; }
  button { margin-top: 12px; border: 0; border-radius: 999px; padding: 10px 22px; background: var(--z); color: #fff; font: 600 15px system-ui, sans-serif; cursor: pointer; }
  button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  button[disabled] { opacity: .6; cursor: default; }
</style>
</head>
<body>
  <div class="box">
    <div class="logo" aria-hidden="true">Z</div>
    <h1 id="title"></h1>
    <p id="body"></p>
    <button id="retry" type="button"></button>
  </div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  document.documentElement.lang = q.get('lang') || 'en';
  document.documentElement.dir = q.get('dir') === 'rtl' ? 'rtl' : 'ltr';
  document.getElementById('title').textContent = q.get('title') || 'No internet connection';
  document.getElementById('body').textContent = q.get('body') || '';
  var btn = document.getElementById('retry');
  btn.textContent = q.get('retry') || 'Try again';
  btn.addEventListener('click', function () {
    btn.disabled = true;
    btn.textContent = q.get('trying') || '…';
    location.href = 'https://orvalen.me/';
  });
})();
</script>
</body>
</html>
