<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'sha256-IEl+/8wLoZVtqU5ivkPED/ESB+xlc3rk6+V+J94I9jo='">
<title>Z</title>
<style>
  /* The window bar shown only when Z leaves full screen (O 26.11, sketch 3): the Z mark with its orange dot,
     no white background, and the release name in the middle. Nothing here can be selected or dragged out. */
  :root { color-scheme: light dark; --bar:#eef1f5; --ink:#1b2028; }
  @media (prefers-color-scheme: dark) { :root { --bar:#1c1f26; --ink:#e9edf3; } }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { background: var(--bar); color: var(--ink); display: flex; align-items: center; justify-content: center;
         font: 500 12.5px/1 "Inter", -apple-system, "Segoe UI", "Noto Sans", Ubuntu, system-ui, sans-serif;
         font-variant-numeric: tabular-nums; direction: ltr; user-select: none; -webkit-user-select: none;
         -webkit-app-region: drag; cursor: default; }
  .id { display: flex; align-items: center; gap: 8px; pointer-events: none; }
  svg { width: 16px; height: 16px; display: block; }
</style>
</head>
<body>
  <div class="id"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M14 16h34v6L24 44h24v6H14v-6l24-22H14z" fill="currentColor"/><rect x="50" y="42" width="9" height="9" fill="#ff9f0a"/></svg><span id="name"></span></div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var name = (q.get('name') || '').slice(0, 40);
  document.getElementById('name').textContent = name;
  document.title = name ? 'Z ' + name : 'Z';
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  document.addEventListener('dragstart', function (e) { e.preventDefault(); });
})();
</script>
</body>
</html>
