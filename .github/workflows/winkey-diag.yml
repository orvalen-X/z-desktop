# Diagnostic only, on the work branch (never merged): span mode, F11 out and back, with and without the Windows-key hold.
name: Span F11 diagnostic
on:
  push:
    branches: [claude/project-thread-yb0dir]
    paths: ['diag/**', '.github/workflows/winkey-diag.yml']
permissions:
  contents: read
jobs:
  diag:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts; node node_modules/electron/install.js; Test-Path node_modules/electron/dist/electron.exe
        shell: pwsh
      - name: run
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json; $pkg.main = "diag/boot.js"; $pkg | ConvertTo-Json -Depth 20 | Set-Content package.json
          foreach ($keys in @("1","0")) {
            Write-Output "=========== winKeys=$keys"
            $env:DIAG_KEYS = $keys
            $p = Start-Process -FilePath "node_modules\electron\dist\electron.exe" -ArgumentList "." -PassThru -RedirectStandardOutput "out-$keys.txt" -RedirectStandardError "err-$keys.txt"
            Start-Sleep 7;  powershell -NoProfile -File diag\screen.ps1 -Tag "k$keys start"
            Start-Sleep 5;  powershell -NoProfile -File diag\screen.ps1 -Tag "k$keys windowed"
            Start-Sleep 7;  powershell -NoProfile -File diag\screen.ps1 -Tag "k$keys full-again"
            Start-Sleep 6
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; Get-Process electron -ErrorAction SilentlyContinue | Stop-Process -Force
            Get-Content "out-$keys.txt" | Select-String "\[diag\]"
          }
